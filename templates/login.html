{% extends './base/base.html' %}


{% block content %}

<hr/>

{% load crispy_forms_tags %}
<form action="{% url 'login' %}" method="POST", style="width:400px; margin: auto;" class="text-center">
    {% csrf_token %} 

    {{ form | crispy}}
    <input type="submit" value="login" class="btn btn-dark">
</form>


{% endblock %}
