{% extends 'base/base.html' %}


{% block content %}

<!-- Recent article -->
<h3 class="badge bg-warning text-uppercase text-light rounded-pill" style="letter-spacing: 1px; font-size: 11px;">Category - {{ category }} </h3>
  <main role="main" class="container p-0">
    <div class="row">
      <div class="col-md-8 blog-main">
        {% for post in posts %}
          <div class="card border-0" >
            <div class="card-body">
              <h3><a href="{% url 'blogs' post.slug %}">{{ post.title }}</a></h3>
              <img src="{{ post.blog_image.url }}" alt="{{ post.title }}" class="img-fluid rounded mb-3" style="width: 100%; height: 100%; object-fit: cover;">
              <small class="mb-1 text-muted">{{ post.created_at | timesince }} ago | {{ post.author }}</small> 
              <p class="card-text">{{ post.short_description | truncatewords:50 }}</p>
              <a href="{% url 'blogs' post.slug %}" class="text-dark">Click here to continue . . .</a>

            </div>
          </div>
          {% endfor %}
      </div>
      <!-- /.blog-main -->
    

    </div><!-- /.row -->

  </main><!-- /.container -->

</div>


{% endblock %}
