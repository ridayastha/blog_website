{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find bugs instantly | BugSquash</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
  </head>
<body>
    <div class="container">

      <header class="blog-header py-3">
        <div class="row align-items-center">
          <!-- Logo -->
          <div class="col-12 col-md-3 text-center text-md-left">
            <img src="/static/images/Giant bug.png" alt="Logo" class="logo-img">
            <a class="blog-header-logo text-dark font-weight-bold" href="/">BugSquash</a>
          </div>
      
          <!-- Search Bar -->
          <div class="col-12 col-md-5">
            <form action="{% url 'search' %}" method="GET">
              <div class="input-group">
                <input class="form-control" name="keyword" type="text" placeholder="Try find your issue...." aria-label="Enter search term..." />
                <div class="input-group-append">
                  <button type="submit" class="btn btn-danger"><i class="bi bi-search d-flex"></i></button>
                </div>
              </div>
            </form>
          </div>
      
          <!-- Auth Buttons -->
          <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end mt-2 mt-md-0">
            {% if not user.is_authenticated %}
              <a class="btn btn-sm btn-outline-dark mr-2" href="{% url 'login' %}">Login</a>
              <a class="btn btn-sm btn-secondary" href="{% url 'register' %}">Register</a>
            {% else %}
              <!-- <a href="{% url 'dashboard' %}" class="btn btn-sm btn-primary text-white mr-2">Dashboard</a> -->
              <a href="{% url 'logout' %}" class="btn btn-danger"><i class="bi bi-power d-flex"></i></a>
            {% endif %}
          </div>
        </div>
      </header>
      

      <div class="nav-scroller py-1 mb-2 bg-light border-bottom border-dark">
        <nav class="nav d-flex justify-content-around align-items-center">
          {% for cat in categories %}
          <a class="p-2 text-dark text-uppercase" href="{% url 'posts_by_category' cat.id %}">{{ cat.category_name }}</a>
          {% endfor %}
        </nav>
      </div>
